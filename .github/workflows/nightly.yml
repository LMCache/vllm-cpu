name: Publish verified CPU wheels (2026-11-19 recovery)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  publish:
    if: github.repository == 'LMCache/vllm-cpu'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require the successful reviewed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/LMCache/vllm-cpu/actions/runs/44437484846 > run.json
          gh api repos/LMCache/vllm-cpu/actions/runs/44437484846/jobs?per_page=100 > jobs.json
          python - <<'PY'
          import json
          from pathlib import Path

          run = json.loads(Path("run.json").read_text())
          assert run["head_sha"] == "f74741969325f6c853f22acf3df6e26f29928ac3"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          jobs = json.loads(Path("jobs.json").read_text())["jobs"]
          for name in ("Build (ubuntu-22.04)", "Build (macos-latest)"):
              assert any(j["name"] == name and j["conclusion"] == "success" for j in jobs)
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44437484846
          pattern: vllm-cpu-nightly-*-wheels
          merge-multiple: true
          path: dist
      - name: Verify matching platform wheels and provenance
        run: |
          python - <<'PY'
          import email
          import hashlib
          import json
          from pathlib import Path
          import zipfile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 2
          assert sum("manylinux" in p.name for p in wheels) == 1
          assert sum("macosx" in p.name for p in wheels) == 1
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata_name = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
                  metadata = email.message_from_bytes(archive.read(metadata_name))
                  manifest = json.loads(archive.read(metadata_name.rsplit("/", 1)[0] + "/cpu-nightly.json"))
              assert metadata["Name"] == "vllm-cpu-nightly"
              assert metadata["Version"] == "0.34.1.dev202611190133"
              assert manifest["source_sha"] == "8700cc9ba0016bf14d8f2756f3b673e93fbcf2fd"
              print(wheel.name, hashlib.sha256(wheel.read_bytes()).hexdigest(), manifest["source_sha"])
          PY
      - name: Check and publish the verified wheels
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install twine
          twine check dist/*.whl
          twine upload --verbose --non-interactive --disable-progress-bar dist/*.whl
